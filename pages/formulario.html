<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karma:wght@400;700&family=Lato:wght@100;300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/css_pages/formulario.css">
</head>
<body>
    <section class="formulario-container">
        <div class="formulario-content">
            <div class="formulario-texto">
                <h1>Envie uma Mensagem em Garrafa <img src="../assets/img/form-garrafa.png" alt="Imagem de garrafa com mensagem dentro" class="formulario-img-garrafa"> </h1>
                <p>Tem dúvidas sobre nossos cursos? Lance sua mensagem ao mar e nossa tripulação responde rapidinho!</p>
            </div>
        <div class="formulario-form">
            <form id="form-contato" action="#" method="post">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Como a tripulação deve te chamar?" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Ex.: pirata.curioso@email.com" required>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Avistei um curso no horizonte e gostaria de saber..." rows="5" required></textarea>
                </div>

                <button type="submit">Enviar ao Capitão!</button>
            </form>
        </div>
        </div>
    </section>
</body>
</html>
