<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karma:wght@400;700&family=Lato:wght@100;300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/css_pages/formulario.css">
</head>
<body>
    <section class="formulario-container">
        <div class="formulario-content">
            <div class="formulario-texto">
                <h1>Envie uma Mensagem em Garrafa <img src="/assets/img/garrafa-mensagem.png" alt="Imagem de garrafa com mensagem dentro" class="formulario-img-garrafa"> </h1>
                <p>Tem dúvidas sobre nossos cursos? Lance sua mensagem ao mar e nossa tripulação responde rapidinho!</p>
            </div>
            <div class="formulario-form">
                <form action="#" method="post">
                    <label for="nome" class="label-nome">Nome completo</label><br>
                    <input type="text" id="nome" placeholder="Como a tripulação deve te chamar?" name="nome" required><br><br>

                    <label for="email">E-mail</label><br>
                    <input type="email" id="email" placeholder="Ex.: pirata.curioso@email.com" name="email" required><br><br>

                    <label for="mensagem">Mensagem</label><br>
                    <textarea id="mensagem" name="mensagem" placeholder="Avistei um curso no horizonte e gostaria de saber..." rows="5" required></textarea><br><br>

                    <button type="submit">Enviar ao Capitão!</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
